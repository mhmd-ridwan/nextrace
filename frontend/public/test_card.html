<!DOCTYPE html>
<html>
<head>
<style>
body {
  background: #0d1420;
  margin: 40px;
  display: flex;
  font-family: sans-serif;
  color: white;
}
.card {
  background: #0d1420;
  border: 1px solid #141e2e;
  border-radius: 16px;
  padding: 16px;
  width: 500px;
}
.header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.title {
  font-size: 13px;
  font-weight: 700;
  color: white;
}
.content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.map-container {
  width: 280px;
  height: 150px;
  position: relative;
}
.stats {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
}
.stat-name {
  color: #94a3b8;
  white-space: nowrap;
}
.stat-val {
  color: white;
  font-weight: 700;
  font-family: monospace;
}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00e599" stroke-width="2">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </svg>
    <div class="title">Sebaran Sumber Kebocoran</div>
  </div>
  <div class="content">
    <div class="map-container" id="mapBox">
      <!-- SVG inserted here -->
    </div>
    <div class="stats">
      <div class="stat-row"><span class="stat-name">Media Sosial</span><span class="stat-val">36.5%</span></div>
      <div class="stat-row"><span class="stat-name">Marketplace</span><span class="stat-val">21.3%</span></div>
      <div class="stat-row"><span class="stat-name">Website / Forum</span><span class="stat-val">15.2%</span></div>
      <div class="stat-row"><span class="stat-name">Aplikasi Mobile</span><span class="stat-val">12.4%</span></div>
      <div class="stat-row"><span class="stat-name">Lainnya</span><span class="stat-val">14.6%</span></div>
    </div>
  </div>
</div>
<script>
fetch('/test_world_refined.svg')
  .then(r => r.text())
  .then(svg => {
    document.getElementById('mapBox').innerHTML = svg;
  });
</script>
</body>
</html>
